[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # os modelos .xlsx precisam ir junto com o codigo da funcao
  included_files = ["netlify/functions/templates/**"]
  # xlsx usa require dinamico e quebra se for empacotado pelo esbuild
  external_node_modules = ["xlsx"]
